[project]
name = "nur"
version = "0.1.0"
description = "Modular AI video generation pipeline — Arabic script + audio -> cinematic vertical MP4"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "pillow>=10.0",          # لازم تكون مبنية مع libraqm — في حارس عند الإقلاع
  "imageio-ffmpeg>=0.5",   # بتجيب ffmpeg 7.0.2 ثابت — نفس البناء المعايَر
  "numpy>=1.26",
]

# ملاحظة مثبَّتة: `arabic-reshaper` و`python-bidi` **ممنوعتان**.
# مقيس: delete_harakat=True افتراضيًا بيحذف كل التشكيل (20 حركة -> 0)،
# والرسم بيطلع مقلوبًا وحروفه مفكوكة. شوف SPIKE-FINDINGS.md / F1.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "golden: صور مرجعية — مكدّس خطوط مختلف بيغيّر النتيجة",
  "ffmpeg: بيشغّل ffmpeg فعلًا",
  "network: بيحتاج شبكة — مستثنى من الوحدات",
]
